<!DOCTYPE html>
<!--
  OVERLAY TIKTOK LIVE - LA FORTE ITALIA
  Uso: TikTok LIVE Studio / OBS -> Aggiungi sorgente "Browser" (o "Link")
       -> File locale: questo file  |  Larghezza 1080  Altezza 1920
  Il logo è già incorporato nel file: basta questo solo file.
  Modifica i testi nella sezione CONFIG qui sotto.
-->
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Overlay LFI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#009246; --bianco:#f4f5f0; --rosso:#ce2b37;
    --oro:#d8b24a; --scuro:rgba(10,12,18,.78); --scuro2:rgba(10,12,18,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:'Montserrat',sans-serif;color:var(--bianco)}

  /* ---------- CORNICE TRICOLORE ---------- */
  .frame{position:absolute;inset:0;pointer-events:none}
  .frame .side{position:absolute;top:0;bottom:0;width:10px;
    background:linear-gradient(180deg,var(--verde) 0 33.3%,var(--bianco) 33.3% 66.6%,var(--rosso) 66.6% 100%);
    background-size:100% 300%;animation:flow 6s linear infinite;opacity:.9}
  .frame .l{left:0}.frame .r{right:0;animation-direction:reverse}
  @keyframes flow{from{background-position:0 0}to{background-position:0 300%}}
  .corner{position:absolute;width:90px;height:90px;border:4px solid var(--oro);opacity:.85}
  .c1{top:24px;left:24px;border-right:none;border-bottom:none;border-radius:14px 0 0 0}
  .c2{top:24px;right:24px;border-left:none;border-bottom:none;border-radius:0 14px 0 0}

  /* ---------- HEADER (LOGO) ---------- */
  .header{position:absolute;top:110px;left:50%;transform:translateX(-50%);width:420px;height:420px;
    animation:drop 1.1s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes drop{from{transform:translate(-50%,-140%)}to{transform:translate(-50%,0)}}
  .header::before{content:"";position:absolute;inset:-30px;border-radius:50%;
    background:radial-gradient(circle,rgba(216,178,74,.55),rgba(206,43,55,.18) 45%,transparent 68%);
    animation:glow 2.6s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
  .header img{position:relative;width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.7));animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-10px) rotate(.6deg)}}
  .shine{position:absolute;inset:0;pointer-events:none;
    -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;
    background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
    background-size:300% 100%;animation:shine 5s ease-in-out infinite;animation-delay:1.2s}
  @keyframes shine{0%{background-position:150% 0}35%,100%{background-position:-50% 0}}

  /* ---------- LIVE + OROLOGIO ---------- */
  .live{position:absolute;top:555px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;white-space:nowrap}
  .pill{display:flex;align-items:center;gap:12px;padding:10px 26px;border-radius:999px;font-weight:900;font-size:30px;letter-spacing:2px}
  .pill.red{background:var(--rosso);box-shadow:0 0 25px rgba(206,43,55,.7)}
  .dot{width:16px;height:16px;border-radius:50%;background:#fff;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.15}}
  .pill.dark{background:var(--scuro);border:2px solid rgba(216,178,74,.5);font-size:30px;font-weight:800}
  .pill.date{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--oro);text-transform:capitalize}
  #clock{font-variant-numeric:tabular-nums;min-width:170px;justify-content:center}

  /* ---------- MESSAGGI A ROTAZIONE ---------- */
  .rot{position:absolute;top:1060px;left:40px;max-width:640px;padding:22px 30px 22px 26px;
    background:var(--scuro);border-left:8px solid var(--oro);border-radius:0 18px 18px 0;
    font-size:30px;font-weight:700;line-height:1.25;box-shadow:0 8px 30px rgba(0,0,0,.45);
    transition:opacity .6s,transform .6s}
  .rot small{display:block;font-size:18px;letter-spacing:4px;color:var(--oro);margin-bottom:6px}
  .rot.out{opacity:0;transform:translateX(-40px)}

  /* ---------- TICKER ---------- */
  .ticker{position:absolute;top:1220px;left:0;right:0;height:64px;display:flex;align-items:center;
    background:linear-gradient(90deg,rgba(0,146,70,.9),rgba(10,12,18,.85) 18%,rgba(10,12,18,.85) 82%,rgba(206,43,55,.9));
    border-top:2px solid rgba(216,178,74,.6);border-bottom:2px solid rgba(216,178,74,.6);overflow:hidden}
  .ticker .lab{flex:none;z-index:2;height:100%;display:flex;align-items:center;padding:0 24px;
    background:var(--oro);color:#111;font-family:'Bebas Neue',Impact,sans-serif;font-size:38px;letter-spacing:2px}
  .track{display:flex;white-space:nowrap;animation:scroll 35s linear infinite}
  .track span{font-size:28px;font-weight:700;padding-right:80px}
  .track b{color:var(--oro)}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
</head>
<body>

<div class="frame"><div class="side l"></div><div class="side r"></div>

<div class="header" id="header">

</div>

<div class="rot" id="rot"><small>LA FORTE ITALIA</small><div id="rotTxt"></div></div>

document.getElementById('logo').src = LOGO;
document.getElementById('header').style.setProperty('--logo', `url(${LOGO})`);

// Ticker (duplicato per scorrimento continuo)
const t = CONFIG.ticker.map(x=>`<span>★ ${x}</span>`).join('');
document.getElementById('track').innerHTML = t + t;

// Messaggi a rotazione
let i = 0; const rot = document.getElementById('rot'), rt = document.getElementById('rotTxt');
rt.textContent = CONFIG.messaggi[0];
setInterval(()=>{ rot.classList.add('out');
  setTimeout(()=>{ i=(i+1)%CONFIG.messaggi.length; rt.textContent=CONFIG.messaggi[i]; rot.classList.remove('out'); },600);
},8000);

// Orologio reale (ora italiana), aggiornato ogni secondo
const ck = document.getElementById('clock'), dt = document.getElementById('date');
const tick = ()=>{
  const d = new Date();
  ck.textContent = d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Europe/Rome'});
  dt.textContent = d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short',timeZone:'Europe/Rome'});
};
tick(); setInterval(tick,1000);
</script>
